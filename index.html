<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0e1119" id="theme-color" />
  <title>iPhone</title>

  <!-- Fonts are the only external assets on this page. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet" />

  <style>
    /* =========================================================
       TOKENS
       ========================================================= */
    :root {
      --blush: #FFD6E8;
      --rose: #FF8FB8;
      --lavender: #E6D5FF;
      --cream: #FFF8F0;
      --ink: #8A2A5B;
      --ink-soft: #A85B7D;
      --ink-deep: #611C3F;

      --ui: "Poppins", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --script: "Great Vibes", "Segoe Script", cursive;

      --ease: cubic-bezier(.2, .75, .25, 1);
      --spring: cubic-bezier(.2, .9, .3, 1.12);
    }

    /* =========================================================
       RESET / PAGE FRAME
       ========================================================= */
    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #161015;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    body {
      min-height: 100dvh;
      display: grid;
      place-items: center;
      font-family: var(--ui);
      color: var(--ink);
      overscroll-behavior: none;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    button {
      margin: 0;
      padding: 0;
      border: 0;
      background: none;
      color: inherit;
      font: inherit;
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    button:focus-visible,
    [tabindex]:focus-visible {
      outline: 2px solid var(--rose);
      outline-offset: 4px;
    }

    ::selection { background: var(--rose); color: var(--cream); }

    .sr-only {
      position: absolute !important;
      width: 1px !important;
      height: 1px !important;
      padding: 0 !important;
      margin: -1px !important;
      overflow: hidden !important;
      clip: rect(0, 0, 0, 0) !important;
      white-space: nowrap !important;
      border: 0 !important;
    }

    #app {
      position: relative;
      width: min(100vw, 430px);
      height: 100dvh;
      overflow: hidden;
      background: #141018;
      isolation: isolate;
      -webkit-user-select: none;
      user-select: none;
    }

    @media (min-width: 560px) and (min-height: 680px) {
      body {
        padding: 22px;
        background:
          radial-gradient(80% 70% at 50% 8%, rgba(255, 143, 184, .14), transparent 60%),
          radial-gradient(60% 60% at 82% 86%, rgba(230, 213, 255, .09), transparent 65%),
          #160f15;
      }
      #app {
        height: min(calc(100dvh - 44px), 900px);
        border-radius: 42px;
        box-shadow:
          0 50px 120px rgba(0, 0, 0, .55),
          0 0 0 1px rgba(255, 255, 255, .08),
          0 0 90px rgba(255, 143, 184, .08);
      }
    }

    /* =========================================================
       SCREEN SWITCHER — fade + blur between worlds
       ========================================================= */
    .screen {
      position: absolute;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      filter: blur(14px);
      transform: translateY(12px) scale(.988);
      transition:
        opacity .65s var(--ease),
        filter .65s var(--ease),
        transform .65s var(--ease),
        visibility 0s linear .65s;
    }

    .screen.is-active {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      filter: blur(0);
      transform: none;
      transition-delay: 0s;
    }

    /* =========================================================
       THE PERSISTENT WORLD
       ========================================================= */
    .world {
      position: absolute;
      inset: 0;
      z-index: 1;
      overflow: hidden;
      opacity: 0;
      transform: scale(1.045);
      filter: blur(14px);
      pointer-events: none;
      background: linear-gradient(180deg,
        #F7BDD6 0%,
        #FFD6E8 18%,
        #F8D8EC 38%,
        #E6D5FF 66%,
        #F1E4FA 83%,
        #FFF8F0 100%);
      transition:
        opacity 1.15s var(--ease),
        transform 1.6s var(--ease),
        filter 1.15s var(--ease);
    }

    #app.is-unlocked .world {
      opacity: 1;
      transform: scale(1);
      filter: blur(0);
    }

    .world::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 5;
      background:
        radial-gradient(120% 52% at 50% 105%, rgba(255, 248, 240, .5), transparent 62%),
        linear-gradient(180deg, rgba(255, 239, 247, .08), transparent 25%);
      pointer-events: none;
    }

    .sky {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(70% 45% at 50% 10%, rgba(255, 229, 241, .62), transparent 75%),
        linear-gradient(180deg, #F6B7D2 0%, #FFD6E8 18%, #F7D7EB 40%, #E6D5FF 68%, #F8ECF9 86%, #FFF8F0 100%);
    }

    .sun {
      position: absolute;
      top: 11%;
      left: 50%;
      width: min(72vw, 280px);
      aspect-ratio: 1;
      transform: translateX(-50%);
      border-radius: 50%;
      background: radial-gradient(circle at 50% 50%,
        rgba(255, 251, 245, .92) 0 23%,
        rgba(255, 246, 232, .52) 36%,
        rgba(255, 214, 232, .24) 54%,
        rgba(255, 214, 232, 0) 72%);
      filter: blur(1px);
    }

    .sun::after {
      content: "";
      position: absolute;
      inset: 31%;
      border-radius: 50%;
      background: radial-gradient(circle at 43% 40%, #FFFDF8, #FFF3E5 58%, #FFE9D7 100%);
      opacity: .9;
      box-shadow: 0 0 70px 28px rgba(255, 246, 232, .32);
    }

    .cloud {
      position: absolute;
      z-index: 2;
      height: auto;
      opacity: .52;
      filter: blur(.4px);
      will-change: transform;
    }

    .cloud--one {
      top: 20%;
      left: -17%;
      width: 54%;
      animation: cloudDrift 32s ease-in-out infinite alternate;
    }

    .cloud--two {
      top: 30%;
      right: -22%;
      width: 64%;
      opacity: .37;
      animation: cloudDrift 41s ease-in-out -12s infinite alternate-reverse;
    }

    .cloud--three {
      top: 41%;
      left: 2%;
      width: 34%;
      opacity: .28;
      animation: cloudDrift 37s ease-in-out -20s infinite alternate;
    }

    @keyframes cloudDrift {
      from { transform: translate3d(-7px, 2px, 0); }
      to   { transform: translate3d(14px, -4px, 0); }
    }

    .landscape {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 3;
      overflow: visible;
    }

    .castle {
      transform-origin: 50% 100%;
      animation: castleBreathe 12s ease-in-out infinite alternate;
    }

    @keyframes castleBreathe {
      from { transform: translateY(0) scale(1); }
      to   { transform: translateY(-3px) scale(1.006); }
    }

    .birds {
      opacity: .4;
      animation: birdsFloat 16s ease-in-out infinite alternate;
    }

    @keyframes birdsFloat {
      from { transform: translate(0, 0); }
      to   { transform: translate(12px, -7px); }
    }

    /* Twinkling four-point stars, placed by JS. */
    .sparkle-field, .petal-field {
      position: absolute;
      inset: 0;
      z-index: 4;
      overflow: hidden;
      pointer-events: none;
    }

    .star {
      position: absolute;
      left: var(--x);
      top: var(--y);
      width: var(--size);
      height: var(--size);
      background: var(--star-color, #FFF8F0);
      clip-path: polygon(50% 0%, 59% 41%, 100% 50%, 59% 59%, 50% 100%, 41% 59%, 0% 50%, 41% 41%);
      opacity: .55;
      filter: drop-shadow(0 0 5px rgba(255, 248, 240, .8));
      animation: twinkle var(--twinkle-dur) ease-in-out var(--delay) infinite;
      will-change: transform, opacity;
    }

    .star--dot {
      border-radius: 50%;
      clip-path: none;
      filter: drop-shadow(0 0 4px rgba(255, 248, 240, .65));
    }

    @keyframes twinkle {
      0%, 100% { opacity: .18; transform: scale(.7) rotate(0deg); }
      48%      { opacity: .92; transform: scale(1.15) rotate(20deg); }
      62%      { opacity: .52; transform: scale(.94) rotate(28deg); }
    }

    /* Floating petals, also placed by JS. */
    .petal {
      position: absolute;
      top: -9%;
      left: var(--x);
      width: var(--size);
      height: calc(var(--size) * .68);
      border-radius: 68% 32% 62% 38%;
      background: linear-gradient(135deg, rgba(255, 248, 240, .92), rgba(255, 159, 196, .75));
      opacity: 0;
      filter: blur(var(--blur, 0));
      animation: petalFall var(--dur) linear var(--delay) infinite;
      will-change: transform, opacity;
    }

    @keyframes petalFall {
      0%   { opacity: 0; transform: translate3d(0, -8vh, 0) rotate(0deg) rotateY(0deg); }
      9%   { opacity: var(--opacity, .65); }
      48%  { transform: translate3d(var(--sway), 48vh, 0) rotate(165deg) rotateY(55deg); }
      72%  { opacity: calc(var(--opacity, .65) * .8); }
      100% { opacity: 0; transform: translate3d(calc(var(--sway) * -.75), 112vh, 0) rotate(342deg) rotateY(110deg); }
    }

    /* =========================================================
       THE LILY GARDEN
       ========================================================= */
    .lilies {
      position: absolute;
      left: 0;
      right: 0;
      bottom: -2px;
      z-index: 6;
      width: 100%;
      height: clamp(300px, 46vh, 420px);
      overflow: visible;
      filter: drop-shadow(0 12px 22px rgba(138, 42, 91, .12));
      pointer-events: none;
    }

    .lily-enter {
      opacity: 0;
      transform-box: fill-box;
      transform-origin: 50% 100%;
    }

    .is-unlocked .lily-enter {
      animation: lilyEnter .9s var(--spring) var(--delay) forwards;
    }

    @keyframes lilyEnter {
      0%   { opacity: 0; transform: scaleY(.45) scaleX(.82); }
      45%  { opacity: 1; }
      72%  { transform: scaleY(1.035) scaleX(.985); }
      100% { opacity: 1; transform: scaleY(1) scaleX(1); }
    }

    .bloom {
      opacity: 0;
      transform-box: fill-box;
      transform-origin: 50% 52%;
      transform: scale(.16) rotate(-34deg);
    }

    .is-unlocked .bloom {
      animation: bloomOpen 1.2s var(--spring) calc(var(--delay) + .18s) forwards;
    }

    @keyframes bloomOpen {
      0%   { opacity: 0; transform: scale(.12) rotate(-38deg); }
      42%  { opacity: 1; transform: scale(1.13) rotate(5deg); }
      68%  { transform: scale(.95) rotate(-1.5deg); }
      100% { opacity: 1; transform: scale(1) rotate(0deg); }
    }

    .lily-sway {
      transform-box: fill-box;
      transform-origin: 50% 100%;
    }

    .is-unlocked .lily-sway {
      animation: lilySway var(--sway-dur, 6.5s) ease-in-out calc(var(--delay) + 1.25s) infinite alternate;
    }

    @keyframes lilySway {
      from { transform: rotate(calc(var(--sway) * -1)); }
      to   { transform: rotate(var(--sway)); }
    }

    .is-celebrating .lily-sway {
      animation-name: lilySwayCelebrate;
      animation-duration: 2.7s;
      animation-delay: 0s;
    }

    @keyframes lilySwayCelebrate {
      from { transform: rotate(calc(var(--sway) * -2.1)); }
      to   { transform: rotate(calc(var(--sway) * 2.1)); }
    }

    .bud {
      opacity: 0;
      transform-box: fill-box;
      transform-origin: 50% 100%;
    }

    .is-unlocked .bud {
      animation: budOpen 1s var(--spring) calc(var(--delay) + .5s) forwards;
    }

    @keyframes budOpen {
      0%   { opacity: 0; transform: scale(.4, .1); }
      70%  { opacity: 1; transform: scale(1.05, 1.02); }
      100% { opacity: 1; transform: scale(1); }
    }

    /* =========================================================
       FILM GRAIN / LIGHT
       ========================================================= */
    .grain {
      position: absolute;
      inset: 0;
      z-index: 8;
      opacity: .08;
      pointer-events: none;
      mix-blend-mode: soft-light;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.82' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.55'/%3E%3C/svg%3E");
    }

    /* The effects canvas sits above the UI, but never eats taps. */
    #fx {
      position: absolute;
      inset: 0;
      z-index: 60;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .unlock-flash {
      position: absolute;
      inset: 0;
      z-index: 25;
      opacity: 0;
      pointer-events: none;
      background: radial-gradient(circle at 50% 55%,
        rgba(255, 252, 247, .98) 0%,
        rgba(255, 226, 238, .8) 23%,
        rgba(230, 213, 255, .35) 48%,
        transparent 72%);
    }

    .unlock-flash.is-firing { animation: unlockFlash .95s ease-out forwards; }

    @keyframes unlockFlash {
      0%   { opacity: 0; transform: scale(.8); }
      26%  { opacity: 1; }
      100% { opacity: 0; transform: scale(1.35); }
    }

    /* =========================================================
       SCREEN 1 — THE LOCK SCREEN
       Deliberately neutral. No hearts, crowns, or clues here.
       ========================================================= */
    .lock-screen {
      z-index: 20;
      overflow: hidden;
      background: #0d1018;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", var(--ui);
      transition:
        opacity .85s var(--ease),
        filter .85s var(--ease),
        transform .95s var(--ease),
        visibility 0s linear .95s;
    }

    .lock-screen.is-unlocking {
      opacity: 0;
      filter: blur(24px);
      transform: translateY(-18px) scale(1.045);
      pointer-events: none;
    }

    .lock-screen.is-active { visibility: visible; }

    .lock-wallpaper {
      position: absolute;
      inset: 0;
      z-index: 0;
      background:
        radial-gradient(88% 65% at 78% 12%, rgba(92, 99, 127, .44), transparent 66%),
        radial-gradient(90% 65% at 14% 68%, rgba(50, 62, 84, .55), transparent 72%),
        linear-gradient(156deg, #171b25 0%, #111520 42%, #090b11 100%);
    }

    .lock-wallpaper::before,
    .lock-wallpaper::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      filter: blur(48px);
      opacity: .9;
    }

    .lock-wallpaper::before {
      width: 78%;
      aspect-ratio: 1.2;
      top: 7%;
      left: -24%;
      background: radial-gradient(circle, rgba(53, 66, 92, .55), transparent 68%);
      transform: rotate(-18deg);
    }

    .lock-wallpaper::after {
      width: 78%;
      aspect-ratio: 1.1;
      right: -30%;
      bottom: 12%;
      background: radial-gradient(circle, rgba(70, 58, 86, .42), transparent 68%);
      transform: rotate(22deg);
    }

    .lock-wallpaper .wallpaper-glow {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(115deg, transparent 32%, rgba(185, 195, 218, .05) 47%, transparent 60%),
        radial-gradient(70% 40% at 50% 104%, rgba(9, 10, 15, .7), transparent 70%);
    }

    .lock-status {
      position: relative;
      z-index: 4;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: calc(env(safe-area-inset-top) + 14px) 25px 0;
      font-size: 13.5px;
      font-weight: 600;
      letter-spacing: -.02em;
      line-height: 1;
    }

    .status-right {
      display: flex;
      align-items: center;
      gap: 6px;
      opacity: .94;
    }

    .signal {
      display: flex;
      align-items: flex-end;
      gap: 1.5px;
      height: 10px;
    }

    .signal i {
      display: block;
      width: 2.5px;
      border-radius: 1px;
      background: #fff;
    }

    .signal i:nth-child(1) { height: 4px; }
    .signal i:nth-child(2) { height: 6px; }
    .signal i:nth-child(3) { height: 8px; }
    .signal i:nth-child(4) { height: 10px; }

    .wifi { width: 15px; height: 11px; }
    .battery { width: 24px; height: 12px; }

    .dynamic-island {
      position: absolute;
      z-index: 5;
      top: calc(env(safe-area-inset-top) + 9px);
      left: 50%;
      width: 112px;
      height: 31px;
      border-radius: 999px;
      background: #000;
      transform: translateX(-50%);
      box-shadow: 0 1px 2px rgba(255, 255, 255, .04);
    }

    .lock-main {
      position: relative;
      z-index: 3;
      display: flex;
      flex: 1;
      flex-direction: column;
      align-items: center;
      padding: 0 26px;
      min-height: 0;
    }

    .lock-hero {
      width: 100%;
      padding-top: clamp(18px, 3.8vh, 36px);
      text-align: center;
    }

    .padlock {
      width: 18px;
      height: 18px;
      margin: 0 auto 11px;
      opacity: .78;
    }

    .lock-date {
      margin: 0;
      font-size: 16.5px;
      font-weight: 500;
      letter-spacing: -.02em;
      opacity: .94;
    }

    .lock-clock {
      margin: 1px 0 0;
      font-size: clamp(78px, 23vw, 98px);
      font-weight: 200;
      line-height: 1.02;
      letter-spacing: -.065em;
      font-variant-numeric: tabular-nums;
      text-indent: -.055em;
      text-shadow: 0 2px 28px rgba(0, 0, 0, .18);
    }

    .lock-entry {
      width: 100%;
      margin-top: auto;
      padding-top: 32px;
      text-align: center;
    }

    .passcode-area {
      position: relative;
      min-height: 58px;
    }

    .passcode-label {
      margin: 0 0 17px;
      font-size: 16px;
      font-weight: 500;
      letter-spacing: -.015em;
      opacity: .96;
      transition: opacity .2s ease;
    }

    .dots {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      height: 16px;
    }

    .dot {
      width: 12px;
      height: 12px;
      border: 1.4px solid rgba(255, 255, 255, .68);
      border-radius: 50%;
      background: transparent;
      transition:
        background .16s ease,
        border-color .16s ease,
        transform .22s var(--spring),
        box-shadow .22s ease;
    }

    .dot.is-filled {
      border-color: #fff;
      background: #fff;
      box-shadow: 0 0 9px rgba(255, 255, 255, .25);
      transform: scale(1.05);
    }

    .dots.is-wrong { animation: dotsShake .44s cubic-bezier(.36,.07,.19,.97); }

    @keyframes dotsShake {
      10%, 90% { transform: translateX(-2px); }
      20%, 80% { transform: translateX(4px); }
      30%, 50%, 70% { transform: translateX(-7px); }
      40%, 60% { transform: translateX(7px); }
    }

    .passcode-area.is-correct::after {
      content: "";
      position: absolute;
      top: 19px;
      left: 50%;
      width: 176px;
      height: 68px;
      border: 1px solid rgba(255, 255, 255, .48);
      border-radius: 999px;
      transform: translateX(-50%) scale(.65);
      pointer-events: none;
      animation: hapticRing .7s ease-out forwards;
    }

    @keyframes hapticRing {
      0%   { opacity: .8; transform: translateX(-50%) scale(.58); }
      100% { opacity: 0; transform: translateX(-50%) scale(1.15); }
    }

    .keypad {
      display: grid;
      grid-template-columns: repeat(3, 72px);
      gap: 10px 22px;
      justify-content: center;
      width: 100%;
      margin-top: clamp(17px, 2.7vh, 25px);
      transition: opacity .2s ease;
    }

    .keypad.is-disabled { opacity: .4; pointer-events: none; }

    .key {
      display: flex;
      width: 72px;
      height: 72px;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(255, 255, 255, .06);
      border-radius: 50%;
      background: rgba(255, 255, 255, .105);
      color: #fff;
      -webkit-backdrop-filter: blur(12px);
      backdrop-filter: blur(12px);
      transition:
        background .15s ease,
        transform .13s ease;
    }

    .key:hover { background: rgba(255, 255, 255, .16); }
    .key:active { background: rgba(255, 255, 255, .24); transform: scale(.93); }

    .key-number {
      font-size: 29px;
      font-weight: 300;
      line-height: 1;
      letter-spacing: -.02em;
      font-variant-numeric: tabular-nums;
    }

    .key-letters {
      margin-top: 3px;
      font-size: 8.5px;
      font-weight: 600;
      line-height: 1;
      letter-spacing: .16em;
      text-indent: .16em;
      opacity: .7;
    }

    .key--empty { pointer-events: none; background: transparent; border-color: transparent; }

    .key--delete {
      background: transparent;
      border-color: transparent;
      opacity: .8;
    }

    .key--delete:hover { background: rgba(255, 255, 255, .1); }
    .key--delete svg { width: 25px; height: 19px; }

    .lock-cancel {
      display: block;
      margin: 13px auto 0;
      padding: 9px 24px;
      font-size: 16px;
      font-weight: 400;
      color: rgba(255, 255, 255, .82);
      border-radius: 999px;
      transition: background .15s ease, color .15s ease;
    }

    .lock-cancel:hover { background: rgba(255, 255, 255, .08); color: #fff; }

    .lock-screen :focus-visible { outline-color: rgba(255, 255, 255, .82); }

    .home-indicator {
      position: relative;
      z-index: 4;
      width: 134px;
      height: 5px;
      margin: 8px auto calc(env(safe-area-inset-bottom) + 8px);
      border-radius: 999px;
      background: rgba(255, 255, 255, .48);
      flex: 0 0 auto;
    }

    /* =========================================================
       SCREEN 2 — THE REVEAL
       ========================================================= */
    .reveal-screen {
      z-index: 10;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: calc(env(safe-area-inset-top) + 34px) 24px calc(env(safe-area-inset-bottom) + 20px);
    }

    .reveal-inner {
      position: relative;
      isolation: isolate;
      display: flex;
      width: 100%;
      max-width: 356px;
      flex-direction: column;
      align-items: center;
      transform: translateY(-3.2vh);
    }

    .reveal-inner::before {
      content: "";
      position: absolute;
      z-index: -1;
      inset: -7% -34% -4%;
      border-radius: 50%;
      background: radial-gradient(ellipse at center,
        rgba(255, 248, 240, .42) 0%,
        rgba(255, 248, 240, .2) 42%,
        rgba(255, 248, 240, 0) 72%);
      filter: blur(18px);
      pointer-events: none;
    }

    .screen.is-active .reveal-crown,
    .screen.is-active .reveal-title,
    .screen.is-active .reveal-rule,
    .screen.is-active .reveal-sub,
    .screen.is-active .reveal-cta {
      animation: revealUp .9s var(--ease) both;
    }

    .screen.is-active .reveal-crown { animation-delay: .12s; }
    .screen.is-active .reveal-title { animation-delay: .2s; }
    .screen.is-active .reveal-rule { animation-delay: .35s; }
    .screen.is-active .reveal-sub { animation-delay: .42s; }
    .screen.is-active .reveal-cta { animation-delay: .55s; }

    @keyframes revealUp {
      from { opacity: 0; transform: translateY(18px); filter: blur(7px); }
      to   { opacity: 1; transform: translateY(0); filter: blur(0); }
    }

    .reveal-crown {
      display: flex;
      width: 42px;
      height: 42px;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
      color: var(--ink);
      opacity: .8;
    }

    .reveal-crown svg { width: 32px; height: 28px; overflow: visible; }

    .reveal-title {
      margin: 0;
      color: var(--ink);
      font-family: var(--script);
      font-size: clamp(54px, 15.8vw, 68px);
      font-weight: 400;
      line-height: .92;
      letter-spacing: .005em;
      text-shadow: 0 2px 32px rgba(255, 248, 240, .42);
    }

    .reveal-title span { display: block; }
    .reveal-title > span:last-child { white-space: nowrap; }

    .reveal-title .title-crown {
      display: inline-block;
      margin-left: 2px;
      font-family: var(--ui);
      font-size: .46em;
      line-height: 1;
      vertical-align: .34em;
      transform: rotate(8deg);
      filter: drop-shadow(0 4px 6px rgba(138, 42, 91, .16));
    }

    .reveal-rule {
      position: relative;
      display: flex;
      width: min(190px, 64%);
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin: 17px 0 14px;
      color: var(--ink-soft);
      opacity: .72;
    }

    .reveal-rule::before,
    .reveal-rule::after {
      content: "";
      height: 1px;
      flex: 1;
      background: linear-gradient(90deg, transparent, rgba(138, 42, 91, .38));
    }

    .reveal-rule::after { transform: scaleX(-1); }

    .reveal-rule i {
      display: block;
      width: 5px;
      height: 5px;
      background: currentColor;
      clip-path: polygon(50% 0%, 61% 39%, 100% 50%, 61% 61%, 50% 100%, 39% 61%, 0% 50%, 39% 39%);
    }

    .reveal-sub {
      margin: 0;
      color: var(--ink-soft);
      font-size: 13.5px;
      font-weight: 300;
      letter-spacing: .035em;
      line-height: 1.65;
      opacity: .95;
    }

    .reveal-cta { margin-top: 26px; }

    /* Shared romantic button */
    .btn {
      position: relative;
      display: inline-flex;
      min-height: 48px;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 13px 24px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: .015em;
      line-height: 1;
      transition:
        transform .22s var(--spring),
        background .22s ease,
        box-shadow .22s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .btn svg { width: 15px; height: 15px; transition: transform .25s var(--ease); }

    .btn:hover { transform: translateY(-2px); }
    .btn:hover svg { transform: translateX(2px); }
    .btn:active { transform: translateY(0) scale(.97); }

    .btn--ghost {
      border: 1px solid rgba(255, 255, 255, .82);
      background: rgba(255, 248, 240, .64);
      color: var(--ink);
      box-shadow:
        0 9px 28px rgba(138, 42, 91, .11),
        inset 0 1px 0 rgba(255, 255, 255, .8);
      -webkit-backdrop-filter: blur(16px) saturate(125%);
      backdrop-filter: blur(16px) saturate(125%);
    }

    .btn--ghost:hover { background: rgba(255, 248, 240, .84); }

    .btn--rose {
      background: var(--ink);
      color: var(--cream);
      box-shadow:
        0 12px 28px rgba(138, 42, 91, .24),
        inset 0 1px 0 rgba(255, 255, 255, .18);
    }

    .btn--rose:hover { background: #77214F; }

    .btn--rose svg { width: 17px; height: 17px; }

    /* =========================================================
       SCREEN 3 — THE LITTLE QUIZ
       ========================================================= */
    .quiz-screen {
      z-index: 10;
      align-items: center;
      justify-content: center;
      padding: calc(env(safe-area-inset-top) + 66px) 19px calc(env(safe-area-inset-bottom) + 150px);
    }

    .quiz-stage {
      width: 100%;
      max-width: 352px;
      perspective: 1000px;
    }

    .glass-card {
      position: relative;
      width: 100%;
      padding: 23px 19px 20px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, .74);
      border-radius: 32px;
      background:
        linear-gradient(145deg, rgba(255, 248, 240, .86), rgba(255, 218, 234, .56));
      box-shadow:
        0 28px 65px rgba(138, 42, 91, .2),
        0 2px 0 rgba(255, 255, 255, .46) inset;
      -webkit-backdrop-filter: blur(25px) saturate(130%);
      backdrop-filter: blur(25px) saturate(130%);
      transform-origin: 50% 60%;
      will-change: transform, opacity, filter;
    }

    .glass-card::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      border-radius: inherit;
      background:
        radial-gradient(90% 60% at 8% 0%, rgba(255, 255, 255, .62), transparent 60%),
        radial-gradient(65% 40% at 100% 100%, rgba(230, 213, 255, .28), transparent 70%);
    }

    .glass-card::after {
      content: "";
      position: absolute;
      top: -54px;
      right: -40px;
      width: 140px;
      height: 140px;
      border: 1px solid rgba(255, 255, 255, .34);
      border-radius: 50%;
      pointer-events: none;
    }

    .quiz-question:focus,
    .quiz-question:focus-visible,
    .parchment:focus,
    .parchment:focus-visible {
      outline: none;
    }

    .glass-card.is-leaving {
      animation: cardLeave .34s var(--ease) forwards;
    }

    .glass-card.is-entering {
      animation: cardEnter .62s var(--spring) both;
    }

    @keyframes cardLeave {
      to { opacity: 0; transform: translate3d(-26px, 0, 0) rotate(-1.4deg) scale(.975); filter: blur(6px); }
    }

    @keyframes cardEnter {
      from { opacity: 0; transform: translate3d(34px, 5px, 0) rotate(1.2deg) scale(.98); filter: blur(8px); }
      to   { opacity: 1; transform: none; filter: blur(0); }
    }

    .quiz-meta {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 17px;
    }

    .quiz-kicker {
      color: var(--ink-soft);
      font-family: var(--script);
      font-size: 24px;
      line-height: 1;
      transform: translateY(-2px);
    }

    .pips {
      display: flex;
      flex: 0 0 auto;
      gap: 6px;
      align-items: center;
      padding: 8px 10px;
      border: 1px solid rgba(255, 255, 255, .56);
      border-radius: 999px;
      background: rgba(255, 255, 255, .28);
    }

    .pip {
      width: 5px;
      height: 5px;
      border-radius: 999px;
      background: rgba(138, 42, 91, .2);
      transition: width .3s var(--ease), background .3s ease;
    }

    .pip.is-done { background: var(--rose); }
    .pip.is-current { width: 16px; background: var(--ink); }

    .quiz-question {
      position: relative;
      z-index: 1;
      max-width: 19ch;
      margin: 0;
      color: var(--ink-deep);
      font-size: clamp(23px, 6.5vw, 27px);
      font-weight: 500;
      line-height: 1.22;
      letter-spacing: -.035em;
      text-wrap: balance;
    }

    .quiz-options {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      gap: 9px;
      margin-top: 24px;
    }

    .option {
      display: flex;
      min-height: 54px;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      width: 100%;
      padding: 10px 13px 10px 19px;
      border: 1px solid rgba(255, 255, 255, .72);
      border-radius: 17px;
      background: rgba(255, 255, 255, .46);
      color: var(--ink);
      text-align: left;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .48);
      transition:
        background .2s ease,
        border-color .2s ease,
        transform .18s var(--spring);
    }

    .option-label {
      font-size: 15.5px;
      font-weight: 500;
      letter-spacing: -.01em;
    }

    .option-mark {
      display: grid;
      width: 28px;
      height: 28px;
      flex: 0 0 auto;
      place-items: center;
      border-radius: 50%;
      background: rgba(138, 42, 91, .075);
      color: var(--ink);
      transition: background .2s ease, color .2s ease, transform .2s ease;
    }

    .option-mark svg { width: 12px; height: 12px; }

    .option:hover {
      background: rgba(255, 255, 255, .72);
      border-color: rgba(255, 255, 255, .96);
      transform: translateY(-1px);
    }

    .option:hover .option-mark {
      background: var(--rose);
      color: #fff;
      transform: translateX(1px);
    }

    .option:active { transform: scale(.984); }

    .option.is-chosen {
      background: rgba(255, 143, 184, .24);
      border-color: rgba(255, 255, 255, .98);
      transform: scale(.985);
    }

    .option.is-chosen .option-mark {
      background: var(--ink);
      color: var(--cream);
      animation: markPulse .45s var(--spring);
    }

    @keyframes markPulse {
      0%   { transform: scale(1); }
      42%  { transform: scale(1.3); }
      100% { transform: scale(1); }
    }

    /* Result card */
    .result-mark {
      display: flex;
      width: 66px;
      height: 66px;
      align-items: center;
      justify-content: center;
      margin: 4px auto 17px;
      border: 1px solid rgba(255, 255, 255, .68);
      border-radius: 50%;
      background: rgba(255, 248, 240, .42);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .7);
    }

    .result-mark svg { width: 36px; height: 34px; color: var(--ink); }

    .glass-card.is-result {
      padding-top: 28px;
      padding-bottom: 24px;
      text-align: center;
    }

    .glass-card.is-result .pips { margin-left: auto; margin-right: auto; }

    .result-copy {
      max-width: 15ch;
      margin: 0 auto;
      font-size: clamp(24px, 6.7vw, 28px);
      line-height: 1.25;
    }

    .result-copy .emoji {
      display: inline-block;
      font-family: var(--ui);
      font-size: .76em;
      animation: heartBeat 1.8s ease-in-out infinite;
    }

    @keyframes heartBeat {
      0%, 100% { transform: scale(1); }
      8%       { transform: scale(1.13); }
      16%      { transform: scale(1); }
      24%      { transform: scale(1.08); }
      32%      { transform: scale(1); }
    }

    .glass-card.is-result .btn {
      position: relative;
      z-index: 1;
      width: 100%;
      margin-top: 25px;
    }

    /* =========================================================
       SCREEN 4 — THE FINAL NOTE
       ========================================================= */
    .note-screen {
      z-index: 10;
      align-items: center;
      justify-content: center;
      padding: calc(env(safe-area-inset-top) + 42px) 18px calc(env(safe-area-inset-bottom) + 58px);
    }

    .parchment {
      position: relative;
      width: min(100%, 354px);
      padding: 57px 27px 32px;
      border: 1px solid rgba(255, 255, 255, .84);
      border-radius: 30px 30px 32px 32px;
      background:
        radial-gradient(95% 70% at 16% 0%, rgba(255, 255, 255, .9), transparent 58%),
        radial-gradient(86% 60% at 92% 100%, rgba(230, 213, 255, .32), transparent 62%),
        linear-gradient(145deg, rgba(255, 248, 240, .91), rgba(255, 235, 243, .82));
      box-shadow:
        0 35px 75px rgba(109, 33, 71, .24),
        inset 0 1px 0 rgba(255, 255, 255, .75);
      -webkit-backdrop-filter: blur(24px) saturate(118%);
      backdrop-filter: blur(24px) saturate(118%);
    }

    .parchment::before {
      content: "";
      position: absolute;
      inset: 10px;
      border: 1px solid rgba(138, 42, 91, .12);
      border-radius: 22px 22px 24px 24px;
      pointer-events: none;
    }

    .parchment::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      opacity: .2;
      pointer-events: none;
      background-image: radial-gradient(rgba(138, 42, 91, .32) .45px, transparent .45px);
      background-size: 4px 4px;
      mix-blend-mode: multiply;
      -webkit-mask-image: linear-gradient(180deg, transparent, #000 40%, #000);
      mask-image: linear-gradient(180deg, transparent, #000 40%, #000);
    }

    .seal {
      position: absolute;
      z-index: 3;
      top: -24px;
      left: 50%;
      display: grid;
      width: 54px;
      height: 54px;
      place-items: center;
      border: 1px solid rgba(255, 248, 240, .44);
      border-radius: 50%;
      background:
        radial-gradient(circle at 36% 30%, #B44B79, #8A2A5B 58%, #701F47 100%);
      color: var(--cream);
      box-shadow:
        0 9px 20px rgba(95, 25, 60, .28),
        inset 0 1px 1px rgba(255, 255, 255, .3);
      transform: translateX(-50%);
    }

    .seal svg { width: 25px; height: 21px; overflow: visible; }
    .is-celebrating .seal { animation: sealPulse .85s var(--spring); }

    @keyframes sealPulse {
      0%   { transform: translateX(-50%) scale(1); }
      36%  { transform: translateX(-50%) scale(1.12) rotate(4deg); }
      100% { transform: translateX(-50%) scale(1); }
    }

    .note-kicker {
      position: relative;
      z-index: 2;
      margin: 1px 0 18px;
      color: var(--ink-soft);
      font-family: var(--script);
      font-size: 28px;
      font-weight: 400;
      line-height: 1;
      text-align: center;
    }

    .note-kicker::after {
      content: "✦";
      display: block;
      margin-top: 8px;
      color: var(--rose);
      font-family: var(--ui);
      font-size: 9px;
      letter-spacing: 0;
      opacity: .75;
    }

    .note-copy {
      position: relative;
      z-index: 2;
      margin: 0;
    }

    .note-line {
      position: relative;
      margin: 0 0 8px;
      color: var(--ink);
      font-size: 18.5px;
      font-weight: 300;
      line-height: 1.55;
      letter-spacing: -.012em;
      text-align: center;
    }

    .note-line:last-child { margin-bottom: 0; }

    .note-line--script {
      margin-bottom: 14px;
      font-family: var(--script);
      font-size: clamp(31px, 8.7vw, 38px);
      font-weight: 400;
      line-height: 1.15;
      letter-spacing: .005em;
    }

    .note-line--kiss {
      margin-top: 9px;
      color: var(--ink-deep);
      font-family: var(--script);
      font-size: 27px;
      line-height: 1.2;
    }

    .line-ghost { visibility: hidden; }
    .line-live { position: absolute; inset: 0; }

    .caret {
      display: inline-block;
      width: 1.5px;
      height: .92em;
      margin-left: 2px;
      border-radius: 2px;
      background: var(--rose);
      vertical-align: -.08em;
      opacity: 0;
    }

    .note-line.is-typing .caret { animation: caretBlink .75s steps(1) infinite; }

    @keyframes caretBlink { 0%, 48% { opacity: 1; } 49%, 100% { opacity: 0; } }

    .note-flourish {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      margin-top: 18px;
      color: var(--ink-soft);
      opacity: .58;
    }

    .note-flourish::before,
    .note-flourish::after {
      content: "";
      width: 35px;
      height: 1px;
      background: currentColor;
      opacity: .55;
    }

    .note-flourish i {
      width: 4px;
      height: 4px;
      background: currentColor;
      border-radius: 50%;
    }

    .pressed-lily {
      position: absolute;
      z-index: 1;
      right: 5px;
      bottom: 5px;
      width: 112px;
      height: 112px;
      opacity: .13;
      transform: rotate(-13deg);
      pointer-events: none;
    }

    /* =========================================================
       SHORT SCREENS / SMALL PHONES
       ========================================================= */
    @media (max-height: 760px) {
      .lock-hero { padding-top: 10px; }
      .lock-clock { font-size: clamp(65px, 19vw, 82px); }
      .lock-entry { padding-top: 18px; }
      .keypad { grid-template-columns: repeat(3, 64px); gap: 8px 18px; margin-top: 13px; }
      .key { width: 64px; height: 64px; }
      .key-number { font-size: 25px; }
      .lock-cancel { margin-top: 7px; padding: 7px 22px; }
      .home-indicator { margin-top: 5px; margin-bottom: calc(env(safe-area-inset-bottom) + 5px); }
      .quiz-screen { padding-top: calc(env(safe-area-inset-top) + 36px); padding-bottom: calc(env(safe-area-inset-bottom) + 80px); }
      .glass-card { padding-top: 19px; padding-bottom: 16px; }
      .quiz-question { font-size: 22px; }
      .quiz-options { margin-top: 17px; gap: 7px; }
      .option { min-height: 48px; }
      .note-screen { padding-top: calc(env(safe-area-inset-top) + 28px); padding-bottom: calc(env(safe-area-inset-bottom) + 24px); }
      .parchment { padding: 47px 23px 25px; }
      .note-line { font-size: 17px; margin-bottom: 5px; }
      .note-line--script { font-size: 31px; margin-bottom: 9px; }
      .note-line--kiss { font-size: 24px; }
    }

    @media (max-height: 660px) {
      .lock-clock { font-size: 58px; }
      .padlock { display: none; }
      .lock-date { font-size: 14px; }
      .keypad { grid-template-columns: repeat(3, 56px); gap: 6px 15px; }
      .key { width: 56px; height: 56px; }
      .key-number { font-size: 22px; }
      .key-letters { font-size: 7px; }
      .dots { gap: 16px; }
      .dot { width: 10px; height: 10px; }
      .passcode-label { margin-bottom: 12px; font-size: 14px; }
      .passcode-area { min-height: 45px; }
      .reveal-inner { transform: translateY(-1vh) scale(.9); }
      .parchment { padding-top: 41px; }
    }

    /* =========================================================
       REDUCED MOTION
       ========================================================= */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
        scroll-behavior: auto !important;
      }

      .petal, .sparkle-field { display: none; }
      .lily-enter, .bloom, .bud { opacity: 1 !important; transform: none !important; }
      .lily-sway, .castle, .birds, .cloud { animation: none !important; }
      .screen.is-active .reveal-crown,
      .screen.is-active .reveal-title,
      .screen.is-active .reveal-rule,
      .screen.is-active .reveal-sub,
      .screen.is-active .reveal-cta { opacity: 1; transform: none; filter: none; }
    }
  </style>
</head>
<body>

  <!-- Extra music is optional. Drop a song next to index.html, then uncomment:
  <audio id="bg-music" src="song.mp3" loop preload="auto"></audio>
  -->

  <div id="app" data-screen="lock">
    <!-- The persistent pastel world lives behind every screen after unlock. -->
    <div class="world" id="world" aria-hidden="true">
      <div class="sky"></div>
      <div class="sun"></div>

      <svg class="cloud cloud--one" viewBox="0 0 220 70" fill="none" aria-hidden="true">
        <path d="M8 58c15 0 17-17 33-17 6-18 34-24 46-8 17-10 38 2 38 20 18-5 36 1 42 14H8z" fill="#FFF8F0"/>
      </svg>
      <svg class="cloud cloud--two" viewBox="0 0 220 70" fill="none" aria-hidden="true">
        <path d="M11 58c17 0 18-19 36-19 8-19 38-23 48-5 18-9 35 4 36 22 15-5 34 1 40 14H11z" fill="#FFF8F0"/>
      </svg>
      <svg class="cloud cloud--three" viewBox="0 0 220 70" fill="none" aria-hidden="true">
        <path d="M14 58c14 0 16-15 31-15 7-17 32-21 43-6 15-8 31 4 32 19 13-4 28 1 34 13H14z" fill="#FFF8F0"/>
      </svg>

      <svg class="landscape" viewBox="0 0 430 844" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
        <defs>
          <linearGradient id="hillFar" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#EFAFCC" stop-opacity=".5"/>
            <stop offset="1" stop-color="#F7D0E2" stop-opacity=".9"/>
          </linearGradient>
          <linearGradient id="hillNear" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#F7C6DB"/>
            <stop offset="1" stop-color="#FBE6EF"/>
          </linearGradient>
          <linearGradient id="castleBody" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#FFCCE1"/>
            <stop offset=".46" stop-color="#FFA9CA"/>
            <stop offset="1" stop-color="#E2C7F6"/>
          </linearGradient>
          <linearGradient id="castleShade" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#C98EB5" stop-opacity=".5"/>
            <stop offset="1" stop-color="#D6B6E8" stop-opacity=".16"/>

  <script>
    'use strict';

    /* =========================================================
       EDIT ME
       Passcode is kept on its own line at the very top, as requested.
       ========================================================= */
    const PASSCODE = "222307"; // <-- replace with the real phone passcode

    const CONFIG = {
      reveal: {
        subtitle: "A tiny world, made just for you.",
        cta: "Tap to begin"
      },
      quiz: {
        kicker: "a little game",
        questions: [

          {

            options: ["Babu", "Jaanu", "Pagal"]
          },
          {
            question: "Do you love me?",
            options: ["Yes", "Yes", "Yes"]
          }
        ],
        result: {
          copy: "No need to check, you're always right",
          cta: "What's next"
        }
      },
      note: {
        kicker: "For my princess",
        lines: [
          "Happy Princess Day, mera baccha 👑",
          "Stay happy, stay strong",
          "and stay mine.",
          "Mwah mwah 💋💋"
        ]
      },
      motion: {
        petals: 15,
        sparkles: 15,
        sparkleBurst: 22,
        confetti: 64
      },
      palette: {
        hearts: ["#FF8FB8", "#FFD6E8", "#E6D5FF", "#FFB3CE", "#FFF8F0"],
        sparkles: ["#FFF8F0", "#FFD6E8", "#FF8FB8", "#E6D5FF"]
      }
    };

    /* =========================================================
       SMALL HELPERS
       ========================================================= */
    const $ = (selector, scope = document) => scope.querySelector(selector);
    const $$ = (selector, scope = document) => Array.from(scope.querySelectorAll(selector));
    const app = $("#app");
    const reduceQuery = window.matchMedia("(prefers-reduced-motion: reduce)");
    let reduceMotion = reduceQuery.matches;
    if (reduceQuery.addEventListener) {
      reduceQuery.addEventListener("change", (event) => { reduceMotion = event.matches; });
    }

    const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
    const randomBetween = (min, max) => min + Math.random() * (max - min);
    const randomFrom = (items) => items[Math.floor(Math.random() * items.length)];
    const vibrate = (pattern) => {
      try { navigator.vibrate?.(pattern); } catch (_) { /* haptics are a bonus */ }
    };

    /* =========================================================
       THE CLOCK — real time makes the lock screen feel believable
       ========================================================= */
    const clockEl = $("#lock-clock");
    const dateEl = $("#lock-date");
    const statusTimeEl = $("#status-time");

    function updateClock() {
      const now = new Date();
      const hours = now.getHours() % 12 || 12;
      const minutes = String(now.getMinutes()).padStart(2, "0");
      const time = `${hours}:${minutes}`;
      clockEl.textContent = time;
      statusTimeEl.textContent = time;
      dateEl.textContent = new Intl.DateTimeFormat("en-US", {
        weekday: "long",
        month: "long",
        day: "numeric"
      }).format(now);
    }

    updateClock();
    setInterval(updateClock, 15000);

    /* =========================================================
       LOCK SCREEN PASSCODE
       ========================================================= */
    const lockScreen = $("#lock-screen");
    const dotsEl = $("#dots");
    const labelEl = $("#passcode-label");
    const announcerEl = $("#lock-announcer");
    const passcodeArea = $("#passcode-area");
    const keypadEl = $("#keypad");
    const unlockFlash = $("#unlock-flash");

    const lockState = {
      entered: "",
      locked: false,
      unlocked: false
    };

    function buildPasscodeDots() {
      dotsEl.innerHTML = "";
      const count = Math.max(PASSCODE.length, 4);
      for (let index = 0; index < count; index += 1) {
        const dot = document.createElement("span");
        dot.className = "dot";
        dotsEl.appendChild(dot);
      }
      dotsEl.setAttribute("aria-label", `Passcode has ${count} digits`);
    }

    function paintDots() {
      $$(".dot", dotsEl).forEach((dot, index) => {
        dot.classList.toggle("is-filled", index < lockState.entered.length);
      });
    }

    function announce(message) {
      announcerEl.textContent = "";
      window.setTimeout(() => { announcerEl.textContent = message; }, 30);
    }

    function resetPasscode(message = "Enter Passcode") {
      lockState.entered = "";
      paintDots();
      labelEl.textContent = message;
    }

    function typeDigit(digit) {
      if (lockState.locked || lockState.unlocked) return;
      if (lockState.entered.length >= PASSCODE.length) return;

      lockState.entered += digit;
      paintDots();
      vibrate(7);

      if (labelEl.textContent === "Try Again") labelEl.textContent = "Enter Passcode";

      if (lockState.entered.length === PASSCODE.length) {
        lockState.locked = true;
        window.setTimeout(checkPasscode, 170);
      }
    }

    function deleteDigit() {
      if (lockState.locked || lockState.unlocked || !lockState.entered.length) return;
      lockState.entered = lockState.entered.slice(0, -1);
      paintDots();
      vibrate(4);
    }

    function cancelEntry() {
      if (lockState.locked || lockState.unlocked) return;
      resetPasscode();
      labelEl.textContent = "Enter Passcode";
      dotsEl.classList.remove("is-wrong");
      vibrate(5);
    }

    function checkPasscode() {
      if (lockState.entered === PASSCODE) {
        unlockSuccess();
      } else {
        unlockFailed();
      }
    }

    function unlockFailed() {
      dotsEl.classList.add("is-wrong");
      labelEl.textContent = "Try Again";
      announce("That passcode was incorrect. Try again.");
      vibrate([36, 52, 36]);

      window.setTimeout(() => {
        dotsEl.classList.remove("is-wrong");
        resetPasscode("Enter Passcode");
        lockState.locked = false;
      }, 640);
    }

    function unlockSuccess() {
      lockState.unlocked = true;
      passcodeArea.classList.add("is-correct");
      vibrate(38);
      announce("Unlocked.");

      window.setTimeout(() => {
        unlockFlash.classList.add("is-firing");
        lockScreen.classList.add("is-unlocking");
        app.classList.add("is-unlocked");
        app.dataset.screen = "reveal";

        document.title = "Princess Day 👑";
        $("#theme-color").setAttribute("content", "#FFD6E8");

        window.setTimeout(() => {
          activateScreen("reveal-screen");

    /* =========================================================
       CANVAS EFFECTS — sparkle bursts and the final confetti
       Only canvas is used for particles, as requested.
       ========================================================= */
    const fxCanvas = $("#fx");
    const fxContext = fxCanvas.getContext("2d");
    let fxWidth = 0;
    let fxHeight = 0;
    let fxDpr = 1;
    let particles = [];
    let fxFrame = 0;
    let lastFrameTime = 0;

    function resizeCanvas() {
      const rect = app.getBoundingClientRect();
      fxDpr = Math.min(window.devicePixelRatio || 1, 2);
      fxWidth = rect.width;
      fxHeight = rect.height;
      fxCanvas.width = Math.max(1, Math.round(fxWidth * fxDpr));
      fxCanvas.height = Math.max(1, Math.round(fxHeight * fxDpr));
      fxContext.setTransform(fxDpr, 0, 0, fxDpr, 0, 0);
    }

    resizeCanvas();
    window.addEventListener("resize", resizeCanvas);
    if ("ResizeObserver" in window) {
      new ResizeObserver(resizeCanvas).observe(app);
    }

    function startFX() {
      if (fxFrame) return;
      lastFrameTime = performance.now();
      fxFrame = requestAnimationFrame(stepFX);
    }

    function stepFX(now) {
      const dt = Math.min((now - lastFrameTime) / 1000, .034);
      lastFrameTime = now;
      fxContext.clearRect(0, 0, fxWidth, fxHeight);

      particles = particles.filter((particle) => particle.life > 0);

      for (const particle of particles) {
        particle.life -= dt;
        if (particle.life <= 0) continue;

        particle.vy += particle.gravity * dt;
        particle.vx *= Math.pow(particle.drag, dt * 60);
        particle.vy *= Math.pow(particle.drag, dt * 60);
        particle.x += particle.vx * dt;
        particle.y += particle.vy * dt;
        particle.rotation += particle.spin * dt;

        const progress = 1 - particle.life / particle.maxLife;
        const alpha = particle.kind === "spark"
          ? Math.max(0, 1 - progress * 1.1)
          : Math.min(1, (1 - progress) * 1.5);

        fxContext.save();
        fxContext.globalAlpha = alpha;
        fxContext.translate(particle.x, particle.y);
        fxContext.rotate(particle.rotation);

        if (particle.kind === "heart") {
          drawHeart(particle.size, particle.color);
        } else if (particle.kind === "petal" || particle.kind === "burst-petal") {
          fxContext.fillStyle = particle.color;
          fxContext.beginPath();
          fxContext.ellipse(0, 0, particle.size, particle.size * .58, 0, 0, Math.PI * 2);
          fxContext.fill();
        } else {
          drawSpark(particle.size, particle.color);
        }

        fxContext.restore();
      }

      if (particles.length) {
        fxFrame = requestAnimationFrame(stepFX);
      } else {
        fxFrame = 0;
        fxContext.clearRect(0, 0, fxWidth, fxHeight);
      }
    }

    function drawHeart(size, color) {
      fxContext.fillStyle = color;
      fxContext.beginPath();
      fxContext.moveTo(0, size * .3);
      fxContext.bezierCurveTo(-size * 1.02, -size * .38, -size * .6, -size * .98, 0, -size * .35);
      fxContext.bezierCurveTo(size * .6, -size * .98, size * 1.02, -size * .38, 0, size * .3);
      fxContext.closePath();
      fxContext.fill();
    }

    function drawSpark(size, color) {
      fxContext.strokeStyle = color;
      fxContext.fillStyle = color;
      fxContext.lineWidth = Math.max(1, size * .22);
      fxContext.lineCap = "round";
      fxContext.beginPath();
      fxContext.moveTo(-size, 0);
      fxContext.lineTo(size, 0);
      fxContext.moveTo(0, -size);
      fxContext.lineTo(0, size);
      fxContext.stroke();
      fxContext.beginPath();
      fxContext.arc(0, 0, size * .32, 0, Math.PI * 2);
      fxContext.fill();
    }

    function sparkleBurst(clientX, clientY) {
      if (reduceMotion) return;
      const rect = fxCanvas.getBoundingClientRect();
      const x = clientX - rect.left;
      const y = clientY - rect.top;

      for (let index = 0; index < CONFIG.motion.sparkleBurst; index += 1) {
        const angle = (Math.PI * 2 * index) / CONFIG.motion.sparkleBurst + randomBetween(-.18, .18);
        const speed = randomBetween(45, 190);
        const life = randomBetween(.45, .8);

        particles.push({
          kind: "spark",
          x,
          y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          gravity: 105,
          drag: .975,
          life,
          maxLife: life,
          size: randomBetween(2.2, 5.7),
          rotation: randomBetween(0, Math.PI),
          spin: randomBetween(-2, 2),
          color: randomFrom(CONFIG.palette.sparkles)
        });
      }
      startFX();
    }

    let confettiStarted = false;

      confettiStarted = true;
      app.classList.add("is-celebrating");

      const wave = (count, delay) => {
        window.setTimeout(() => {
          for (let index = 0; index < count; index += 1) {
            const heart = index % 3 === 0;
            const life = randomBetween(5.2, 8.4);
            particles.push({

              x: randomBetween(4, fxWidth - 4),
              y: randomBetween(-fxHeight * .18, -12),

              vy: randomBetween(22, 56),

            });

          startFX();
        }, delay);
      };

      wave(Math.ceil(CONFIG.motion.confetti * .45), 0);
      wave(Math.ceil(CONFIG.motion.confetti * .35), 650);
      wave(Math.ceil(CONFIG.motion.confetti * .2), 1300);
    }

    function renderQuestion(index) {
      const entry = CONFIG.quiz.questions[index];
      quizCard.innerHTML = "";
      quizCard.classList.remove("is-result");

      quizCard.appendChild(makeMeta(CONFIG.quiz.kicker, index));

    function playCardEnter() {
      quizCard.classList.remove("is-entering");

    function startQuiz() {
      beginMusic();
      quizStarted = true;

      activateScreen("quiz-screen");

    function chooseAnswer(button) {
      if (quizBusy) return;
      quizBusy = true;

      button.classList.add("is-chosen");
      vibrate(12);

      const rect = button.getBoundingClientRect();
      sparkleBurst(rect.left + rect.width / 2, rect.top + rect.height / 2);

      window.setTimeout(() => {
        quizCard.classList.add("is-leaving");

        window.setTimeout(() => {
          quizIndex += 1;

          if (quizIndex >= CONFIG.quiz.questions.length) {
            renderResult();
          } else {
            renderQuestion(quizIndex);

          quizCard.classList.remove("is-leaving");
          playCardEnter();
          quizBusy = false;
          focusQuestionSoon();
        }, 340);

      const mark = document.createElement("div");
      mark.className = "result-mark";

      mark.innerHTML = `
        <svg viewBox="0 0 40 36" fill="none">
          <path d="M20 32S3 22.5 3 11.7C3 6.2 7.1 3 11.5 3 15 3 18 5 20 8.2 22 5 25 3 28.5 3 32.9 3 37 6.2 37 11.7 37 22.5 20 32 20 32Z"
                fill="#FFD6E8" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>
          <path d="M20 10.5l1.7 4.8 4.8 1.7-4.8 1.7-1.7 4.8-1.7-4.8-4.8-1.7 4.8-1.7z"
                fill="currentColor" opacity=".72"/>
        </svg>`;

      const copy = document.createElement("h2");
      copy.className = "quiz-question result-copy";
      copy.id = "quiz-question";
      copy.tabIndex = -1;
      copy.textContent = `${CONFIG.quiz.result.copy} `;

      const emoji = document.createElement("span");
      emoji.className = "emoji";
      emoji.setAttribute("aria-hidden", "true");
      emoji.textContent = "💗";
      copy.appendChild(emoji);

      const next = document.createElement("button");
      next.type = "button";
      next.className = "btn btn--rose";
      next.id = "next-btn";

      const nextText = document.createElement("span");
      nextText.textContent = `${CONFIG.quiz.result.cta} `;

      const nextArrow = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      nextArrow.setAttribute("viewBox", "0 0 18 18");
      nextArrow.setAttribute("fill", "none");
      nextArrow.setAttribute("aria-hidden", "true");
      nextArrow.innerHTML = '<path d="M3 9h11M9.5 4.5 14 9l-4.5 4.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>';

      next.append(nextText, nextArrow);
      quizCard.append(meta, mark, copy, next);
    }

    quizCard.addEventListener("click", (event) => {
      const option = event.target.closest(".option");
      if (option) {
        chooseAnswer(option);
        return;
      }

      if (event.target.closest("#next-btn")) {
        startNoteExperience();
      }
    });

    $("#begin-btn").addEventListener("click", startQuiz);

    /* =========================================================
       FINAL NOTE — typewriter, one line at a time
       ========================================================= */
    const noteCopy = $("#note-copy");
    const noteAccess = $("#note-access");
    const parchment = $("#parchment");
    let noteStarted = false;
    let noteTyped = false;

    function buildNote() {
      noteCopy.innerHTML = "";
      noteAccess.textContent = `For my princess. ${CONFIG.note.lines.join(" ")}`;

      CONFIG.note.lines.forEach((line, index) => {
        const p = document.createElement("p");
        p.className = "note-line";
        if (index === 0) p.classList.add("note-line--script");
        if (index === CONFIG.note.lines.length - 1) p.classList.add("note-line--kiss");

        const ghost = document.createElement("span");
        ghost.className = "line-ghost";
        ghost.textContent = line;

        const live = document.createElement("span");
        live.className = "line-live";

        const typed = document.createElement("span");
        typed.className = "line-typed";

        const caret = document.createElement("span");
        caret.className = "caret";
        caret.setAttribute("aria-hidden", "true");

        live.append(typed, caret);
        p.append(ghost, live);
        noteCopy.appendChild(p);
      });
    }

    function delayForCharacter(character) {
      if (reduceMotion) return 0;
      if (/[,.!?]/.test(character)) return 98;
      if (character === " ") return 20;
      return 28;
    }

    async function typeNote() {
      if (noteTyped) return;
      noteTyped = true;

      const lines = $$(".note-line", noteCopy);

      if (reduceMotion) {
        lines.forEach((line) => {
          const typed = $(".line-typed", line);
          const source = $(".line-ghost", line).textContent;
          typed.textContent = source;
          $(".caret", line)?.remove();
        });
        app.classList.add("is-celebrating");
        return;
      }

      for (const line of lines) {
        line.classList.add("is-typing");
        const typed = $(".line-typed", line);
        const source = $(".line-ghost", line).textContent;
        typed.textContent = "";

        for (const character of Array.from(source)) {
          typed.textContent += character;
          await wait(delayForCharacter(character));
        }

        line.classList.remove("is-typing");
        await wait(270);
      }

      // A soft pause, then the room quietly celebrates.
      await wait(420);
      releaseConfetti();
    }

    function startNoteExperience() {
      if (noteStarted) return;
      noteStarted = true;

      buildNote();
      activateScreen("note-screen");
      app.dataset.screen = "note";

      window.setTimeout(() => {
        parchment.setAttribute("tabindex", "-1");
        parchment.focus({ preventScroll: true });
      }, 480);

      window.setTimeout(typeNote, 760);
    }

    // Keep the initial view honest: no autoplay, no music, no reveal.
    app.dataset.screen = "lock";
  </script>
</body>
</html>
